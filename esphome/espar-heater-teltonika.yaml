globals:
  - id: remote_started      # true = running because of a remote command
    type: bool
    initial_value: "false"
  - id: remote_stop_s       # uptime (s) at which the running preset ends; 0 = none
    type: uint32_t
    initial_value: "0"
  - id: fmc_code            # last code seen from the tracker; 0 = nothing since boot, 1 = none
    type: uint16_t
    initial_value: "0"
  - id: cmd_echo            # toggle bit of the last accepted BLE command (acknowledge)
    type: uint8_t
    initial_value: "0"
  - id: cmd_result          # 0 none yet, 1 started, 2 switched off, 3 locked, 4 refused
    type: uint8_t
    initial_value: "0"
  - id: active_preset       # 0 = none, 1–8 = running remote preset
    type: uint8_t
    initial_value: "0"
  - id: ble_seq             # counter per page sent (shows the data is fresh)
    type: uint8_t
    initial_value: "0"
  - id: run_started_s       # uptime (s) when the climate entity left OFF; 0 = off
    type: uint32_t
    initial_value: "0"

interval:
  - interval: 30s
    then:
      - lambda: |-
          uint32_t now_s = millis() / 1000;
          if (id(espar).mode == climate::CLIMATE_MODE_OFF) {
            id(run_started_s) = 0; id(remote_stop_s) = 0; id(remote_started) = false;
            if (id(active_preset) != 0) { id(active_preset) = 0; id(remote_input).publish_state(false); }
            return;
          }
          if (id(remote_stop_s) != 0 && now_s >= id(remote_stop_s)) {
            ESP_LOGW("remote", "duration of preset %u reached — switching off", id(active_preset));
            id(remote_stop_s) = 0;
            auto c = id(espar).make_call();
            c.set_mode(climate::CLIMATE_MODE_OFF);
            c.perform();
            return;
          }
          if (id(run_started_s) == 0) { id(run_started_s) = now_s; return; }
          if (now_s - id(run_started_s) >= (uint32_t) id(max_run_time).state * 60) {
            ESP_LOGW("max_run_time", "%.0f min reached — switching off", id(max_run_time).state);
            id(run_started_s) = 0;
            auto call = id(espar).make_call();
            call.set_mode(climate::CLIMATE_MODE_OFF);
            call.perform();
          }

  # ── BLE feedback to the tracker ──────────────────────────────────────────────
  # Packet: FF FF 53 48 + page 1 (→ tracker BLE connection #2)
  #         FF FF 53 49 + page 2 (→ tracker BLE connection #3), alternating every 2 s.
  # Multi-byte values little endian. "+40" = °C + 40; 255 = unknown.
  # Page 1 (state — everything a remote start needs)
  #   0  Status: bits 0–3 state (0 IDLE, 1 STARTUP, 2 HEATING, 3 FAN, 4 COOLDOWN,
  #      5 FAULT, 6 INIT, 15 heater not connected), bits 4–6 result of the last
  #      command (0 none, 1 started, 2 switched off, 3 locked, 4 refused),
  #      bit 7 acknowledge = toggle bit of the last accepted BLE command
  #      → tracker Custom 2, priority High + On Change (sent immediately)
  #   1  Fault: 0 OK, 1 flame loss, 2 overtemperature, 3 other fault, 4 failed
  #      start, 5 lockout, 6 idle lock, 7 heartbeat lost, 8 second controller
  #      on the bus, 9 other  → tracker Custom 3, High + On Change
  #   2  Phase: 0 Off, 1 Startup, 2 Pre-glow, 3 Ignition, 4 Flame ramp-up,
  #      5 Burning, 6 Cooldown, 7 Control pause, 8 Ventilation, 15 other
  #   3  Bits: 0 flame, 1 glow plug, 2 remote start enabled, 3 CAN standby,
  #      4 HA connected, 5 external room sensor, 6 heater connected, 7 remote run
  #   4  heater temperature +40     5  intake temperature +40
  #   6  setpoint (climate) +40     7  power demand %
  #   8–9  minutes left (0 = off)   10  supply voltage ×10
  #   11–12 flame temperature °C (int16)   13 fuel rate ×100 l/h
  #   14 blower level   15 glow plug power W   16 control unit +40
  #   17–18 burn time min   19 running preset (0 = none)
  #   20 climate mode (0 off, 1 heat, 2 fan)   21 counter
  # Page 2 (counters, fault memory)
  #   0–1 operating hours ×10   2–3 fuel total ×10 l   4–5 starts
  #   6–9 pump strokes   10–19 first 5 codes of the fault memory
  #   (P00xxxx → xxxx, 2 bytes each, 0 = empty)   20 WiFi dBm (absolute, 0 = none)   21 counter
  - interval: 2s
    then:
      - lambda: |-
          auto clampb = [](float v, float lo, float hi) -> uint8_t {
            if (std::isnan(v)) return 255;
            return (uint8_t) std::max(lo, std::min(hi, roundf(v)));
          };
          auto t40 = [&](sensor::Sensor *s) -> uint8_t {
            return (s->has_state() && !std::isnan(s->state)) ? clampb(s->state + 40.0f, 0, 254) : 255;
          };
          auto u16 = [](std::vector<uint8_t> &d, uint32_t v) { if (v > 0xFFFF) v = 0xFFFF; d.push_back(v & 0xFF); d.push_back(v >> 8); };
          auto num = [](sensor::Sensor *s) -> float { return (s->has_state() && !std::isnan(s->state)) ? s->state : 0.0f; };
          static bool page2 = false;
          std::vector<uint8_t> d = {0xFF, 0xFF, 0x53, (uint8_t) (page2 ? 0x49 : 0x48)};

          if (!page2) {
            // state
            const std::string st = id(espar_heater_state).has_state() ? id(espar_heater_state).state : "";
            uint8_t s = 15;
            if (id(espar_connected).state) {
              if      (st == "IDLE")     s = 0;
              else if (st == "STARTUP")  s = 1;
              else if (st == "HEATING")  s = 2;
              else if (st == "FAN")      s = 3;
              else if (st == "COOLDOWN") s = 4;
              else if (st == "FAULT")    s = 5;
              else if (st == "INIT")     s = 6;
            }
            d.push_back(s | ((id(cmd_result) & 0x07) << 4) | (id(cmd_echo) ? 0x80 : 0));
            // fault
            const std::string f = id(espar_fault).has_state() ? id(espar_fault).state : "OK";
            uint8_t e = 9;
            if      (f == "OK")                                   e = 0;
            else if (f.find("FLAME_LOSS") != std::string::npos)   e = 1;
            else if (f.find("OVERTEMP") != std::string::npos)     e = 2;
            else if (f.rfind("FAULT", 0) == 0)                    e = 3;
            else if (f.rfind("Failed start", 0) == 0)             e = 4;
            else if (f.rfind("LOCKOUT", 0) == 0)                  e = 5;
            else if (f.rfind("IDLE LOCK", 0) == 0)                e = 6;
            else if (f.rfind("Heartbeat", 0) == 0)                e = 7;
            else if (f.rfind("OTHER CONTROLLER", 0) == 0)         e = 8;
            d.push_back(e);
            // phase
            const std::string ph = id(d_phase).has_state() ? id(d_phase).state : "";
            static const char *const PH[] = {"Off", "Startup", "Pre-glow", "Ignition", "Flame ramp-up",
                                             "Burning", "Cooldown", "Control pause", "Ventilation"};
            uint8_t pc = 15;
            for (uint8_t k = 0; k < 9; k++) if (ph == PH[k]) pc = k;
            d.push_back(pc);
            // bits
            uint8_t b = 0;
            if (id(d_flame).state)                       b |= 0x01;
            if (id(d_glow).state)                        b |= 0x02;
            if (id(remote_enable).state)                 b |= 0x04;
            if (id(espar_standby).state)                 b |= 0x08;
            if (api::global_api_server->is_connected())  b |= 0x10;
            if (id(sel_room_sensor).active_index().value_or(0) == 1) b |= 0x20;
            if (id(espar_connected).state)               b |= 0x40;
            if (id(remote_started))                      b |= 0x80;
            d.push_back(b);
            d.push_back(t40(id(d_heater_temp)));
            d.push_back(t40(id(d_intake)));
            float tt = id(espar).target_temperature;
            d.push_back(std::isnan(tt) ? 255 : clampb(tt + 40.0f, 0, 254));
            d.push_back(clampb(num(id(d_demand)), 0, 254));
            // minutes left = whichever ends first: Max Run Time or the preset duration
            uint32_t now_s = millis() / 1000, rm = 0;
            if (id(espar).mode != climate::CLIMATE_MODE_OFF) {
              int32_t left = id(run_started_s) != 0
                  ? (int32_t) id(max_run_time).state * 60 - (int32_t) (now_s - id(run_started_s))
                  : (int32_t) id(max_run_time).state * 60;
              if (id(remote_stop_s) != 0) left = std::min(left, (int32_t) id(remote_stop_s) - (int32_t) now_s);
              rm = left <= 0 ? 0 : (left + 59) / 60;
            }
            u16(d, rm);
            d.push_back(clampb(num(id(d_volt)) * 10.0f, 0, 254));
            int16_t ft = (int16_t) roundf(num(id(d_flametemp)));
            d.push_back(ft & 0xFF); d.push_back((ft >> 8) & 0xFF);
            d.push_back(clampb(num(id(d_fuelrate)) * 100.0f, 0, 254));
            d.push_back(clampb(num(id(d_blower)), 0, 254));
            d.push_back(clampb(num(id(d_glowpw)), 0, 254));
            d.push_back(t40(id(d_cutemp)));
            u16(d, (uint32_t) (num(id(d_burn)) / 60.0f));
            d.push_back(id(active_preset));
            auto m = id(espar).mode;
            d.push_back(m == climate::CLIMATE_MODE_HEAT ? 1 : m == climate::CLIMATE_MODE_FAN_ONLY ? 2 : 0);
          } else {
            u16(d, (uint32_t) roundf(num(id(d_ophours)) * 10.0f));
            u16(d, (uint32_t) roundf(num(id(d_fueltotal)) * 10.0f));
            u16(d, (uint32_t) num(id(d_starts)));
            uint32_t st = (uint32_t) num(id(d_strokes));
            for (int k = 0; k < 4; k++) d.push_back((st >> (8 * k)) & 0xFF);
            // fault memory "P000115, P000129, …" → 0x0115, 0x0129, …
            std::string fm = id(d_faultmem).has_state() ? id(d_faultmem).state : "";
            int n = 0;
            for (size_t pos = fm.find('P'); pos != std::string::npos && n < 5; pos = fm.find('P', pos + 1)) {
              size_t e = pos + 1;
              while (e < fm.size() && isxdigit((unsigned char) fm[e])) e++;
              if (e - pos - 1 < 4) continue;
              uint16_t c = (uint16_t) strtoul(fm.substr(e - 4, 4).c_str(), nullptr, 16);
              u16(d, c); n++;
            }
            for (; n < 5; n++) u16(d, 0);
            float r = id(wifi_rssi).state;
            d.push_back((std::isnan(r) || !wifi::global_wifi_component->is_connected()) ? 0 : clampb(-r, 1, 254));
          }
          d.push_back(++id(ble_seq));
          if (d.size() != 26) { ESP_LOGE("remote", "BLE page has %u bytes instead of 26", (unsigned) d.size()); return; }
          static bool started = false;
          if (!started) { esp32_ble::global_ble->advertising_start(); started = true; }
          esp32_ble::global_ble->advertising_set_manufacturer_data(d);
          page2 = !page2;

# ── Safe mode (rolls back bad OTA after 10 crash-loops) ──────────────────────
safe_mode:

# ── mDNS ─────────────────────────────────────────────────────────────────────
mdns:

# ── BLE: advertise the feedback, listen for the tracker's command ────────────
# The device name goes into the scan response, so the advertising packet holds
# exactly flags (3 bytes) + manufacturer data (28 bytes) = 31 bytes.
esp32_ble:
  advertising: true

esp32_ble_tracker:
  scan_parameters:
    active: true
  on_ble_advertise:
    - mac_address: ${tracker_mac}
      then:
        - lambda: |-
            uint16_t code = 1;   // no service UUID in the packet
            for (auto &u : x.get_service_uuids()) {
              auto r = u.get_uuid();
              if (r.len == ESP_UUID_LEN_16) code = r.uuid.uuid16;
            }
            uint16_t old = id(fmc_code);
            if (code == old) return;
            id(fmc_code) = code;
            if (old == 0) {
              // Take over the toggle bit of the standing command: the next command
              // (with the bit flipped) is then a change, also after an ESP reboot.
              if ((code >> 8) == 0x53) id(cmd_echo) = (code & 0x80) ? 1 : 0;
              ESP_LOGI("remote", "tracker seen, baseline %04X", code);
              return;
            }
            ESP_LOGW("remote", "code %04X → %04X", old, code);
            // valid: 0x53 | T000 CCCC with C = 0…8
            if ((code >> 8) != 0x53 || (code & 0x70) != 0 || (code & 0x0F) > 8) return;
            id(cmd_echo) = (code & 0x80) ? 1 : 0;
            id(run_cmd).execute(code & 0x0F);

# ── Result of the last remote command (both paths) ───────────────────────────
text_sensor:
  - platform: template
    id: remote_result
    name: "Espar Remote Result"
    icon: mdi:remote
    web_server: {sorting_group_id: grp_control, sorting_weight: 7}

# ── Execute a remote command — shared by both paths ─────────────────────────
# BLE path: on_ble_advertise (code from the tracker) → run_cmd
# LAN path: HA action esphome.<node>_remote_preset → run_cmd
# cmd: 0 = off, 1–8 = preset. Same checks, same duration, same feedback.
script:
  - id: run_cmd
    mode: queued
    parameters:
      cmd: int
    then:
      - lambda: |-
          if (cmd == 0) {
            ESP_LOGW("remote", "command: off");
            id(cmd_result) = 2;
            id(remote_result).publish_state("switched off");
            id(remote_started) = false;
            id(remote_stop_s) = 0;
            id(active_preset) = 0;
            id(remote_input).publish_state(false);
            auto c = id(espar).make_call();
            c.set_mode(climate::CLIMATE_MODE_OFF);
            c.perform();
            return;
          }
          if (!id(remote_enable).state) {
            ESP_LOGW("remote", "preset %d: locked", cmd);
            id(cmd_result) = 3; id(remote_result).publish_state("locked"); return;
          }
          if (id(espar_standby).state || !id(espar_connected).state) {
            ESP_LOGW("remote", "preset %d: refused (CAN standby or heater not connected)", cmd);
            id(cmd_result) = 4; id(remote_result).publish_state("refused"); return;
          }
          select::Select *modes[8] = {id(preset1_mode), id(preset2_mode), id(preset3_mode), id(preset4_mode),
                                      id(preset5_mode), id(preset6_mode), id(preset7_mode), id(preset8_mode)};
          number::Number *setps[8] = {id(preset1_setp), id(preset2_setp), id(preset3_setp), id(preset4_setp),
                                      id(preset5_setp), id(preset6_setp), id(preset7_setp), id(preset8_setp)};
          number::Number *durs[8]  = {id(preset1_dur), id(preset2_dur), id(preset3_dur), id(preset4_dur),
                                      id(preset5_dur), id(preset6_dur), id(preset7_dur), id(preset8_dur)};
          bool fan = modes[cmd - 1]->active_index().value_or(0) == 1;
          float sp = setps[cmd - 1]->state;
          uint32_t dur_min = (uint32_t) durs[cmd - 1]->state;
          ESP_LOGW("remote", "command: preset %d → %s, %.0f °C, %u min", cmd, fan ? "fan" : "heat", sp, (unsigned) dur_min);
          id(cmd_result) = 1;
          id(remote_result).publish_state(str_sprintf("preset %d started", cmd));
          id(remote_started) = true;
          id(active_preset) = cmd;
          id(remote_input).publish_state(true);
          id(remote_stop_s) = millis() / 1000 + dur_min * 60;
          auto c = id(espar).make_call();
          c.set_mode(fan ? climate::CLIMATE_MODE_FAN_ONLY : climate::CLIMATE_MODE_HEAT);
          if (!fan) c.set_target_temperature(sp);
          c.perform();
