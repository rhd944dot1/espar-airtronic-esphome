# =============================================================================
#  Espar Airtronic S3 CAN Controller — FULL example + Teltonika remote start
#
#  Same as espar-heater-full.yaml, plus remote start through a Teltonika GPS
#  tracker (tested with an FMC920), in both directions over BLE — no wiring
#  between tracker and ESP32. See docs/teltonika-remote-start.md.
#
#    Command  tracker → ESP:  the tracker's "BLE broadcasting service ID"
#             (parameter 1111) is advertised as a 16-bit service UUID.
#             0x53 | T000 CCCC — C = 0 off, 1–8 preset, T = toggle bit.
#             Only a CHANGE triggers; the first value seen after boot is the
#             baseline (no restart of a run after an ESP reboot).
#    Feedback ESP → tracker:  manufacturer data FF FF 53 48|49 + 22 bytes,
#             two pages alternating every 2 s, read by the tracker's
#             "Advanced" BLE sensor table and sent to the server as AVL IO.
#    LAN path: Home Assistant can call the action
#             esphome.<node>_remote_preset directly; same code as the BLE path.
#
#  8 presets (mode, setpoint, duration) are settings on the ESP, editable in HA.
#  The preset duration ends the run on the ESP itself — no network needed.
#  Replace tracker_mac below with your tracker's BLE MAC.
#
#  Every diagnostic entity, grouped web dashboard.
#  The minimal example is espar-heater.yaml; this file adds:
#    - a select to switch the room sensor at run time
#    - all read-only diagnostic entities (diagnostics: block)
#    - a "Max Run Time" safety limit (the heater has none of its own)
#    - web_server v3 with sorting groups
#  See esphome/README.md: "Regulation", "Heater diagnostics".
#
#  Hardware:
#    CAN TX: GPIO27    CAN RX: GPIO26    500 kbps
#    XB10 Pin 7 (GYBU) = CAN H
#    XB10 Pin 8 (GNYE) = CAN L
#    XB10 Pin 2 (BRBK) = Ground reference
#    Onboard 120Ω termination switch K3 — leave OFF when tapping mid-bus
#
#  Climate entity behaviour:
#    HEAT mode  — sends HEAT continuously with the climate target as setpoint
#                 and a room temperature; the heater starts, modulates,
#                 pauses (no flame) and restarts by itself.
#    FAN ONLY   — sends FAN command; heater runs blower, no combustion.
#    OFF        — sends IDLE command.
#
#  Room temperature (select "Espar Room Sensor"):
#    "Heater"   — the heater's own intake sensor (read over UDS), default
#    "External" — the cabin sensor below (cabin_avg_temp)
# =============================================================================

substitutions:
  tracker_mac: "AA:BB:CC:DD:EE:FF"   # BLE MAC of the Teltonika tracker

esphome:
  name: espar-heater
  friendly_name: Espar Heater
  on_boot:
    priority: -100
    then:
      # Apply the stored choice of the select after boot
      - lambda: |-
          id(espar).set_room_sensor_controller(id(sel_room_sensor).active_index().value_or(0) == 1);
      - light.turn_on:
          id: status_led
          red: 0%
          green: 5%
          blue: 0%
          brightness: 20%

esp32:
  board: esp32dev
  framework:
    type: arduino

# ── Network ──────────────────────────────────────────────────────────────────
api:
  reboot_timeout: 0s        # vehicle out of WiFi range: do not reboot mid-run
  encryption:
    key: !secret api_encryption_key
  actions:
    # LAN path of the remote start: esphome.espar_heater_remote_preset(preset: 0–8)
    - action: remote_preset
      variables:
        preset: int
      then:
        - if:
            condition:
              lambda: 'return preset >= 0 && preset <= 8;'
            then:
              - script.execute:
                  id: run_cmd
                  cmd: !lambda 'return preset;'

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s        # see api

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Espar-Heater Fallback Hotspot"
    password: !secret fallback_hotspot_password


# ── Logging ───────────────────────────────────────────────────────────────────
# Use DEBUG during development to see CAN frame activity.
# Switch to INFO for production to reduce log noise.
logger:
  level: DEBUG

# ── External component ────────────────────────────────────────────────────────
external_components:
  - source:
      type: local
      path: components
    components: [espar_can]

# ── Captive Portal ────────────────────────────────────────────────────────

captive_portal:

# ── Sensors ───────────────────────────────────────────────────────────────────
sensor:
  # Cabin averaged temperature pulled from HA via API.
  # Update entity_id to match the template sensor you create in HA.
  - platform: homeassistant
    id: cabin_avg_temp
    entity_id: sensor.cabin_average_temperature   # ← update to your HA sensor
    unit_of_measurement: "°F"
    filters:
      - filter_out: nan                            # ignore unavailable readings
      # No °F→°C lambda needed — cabin_temp_unit: fahrenheit handles conversion
      # internally in the component.

  # WiFi signal — useful for placement decisions in the Trooper
  - platform: wifi_signal
    id: wifi_rssi
    name: "Espar Node WiFi Signal"
    update_interval: 60s
    web_server: {sorting_group_id: grp_diag, sorting_weight: 20}

# ── Espar CAN controller ──────────────────────────────────────────────────────
espar_can:
  id: espar
  name: "Espar Heater"
  web_server: {sorting_group_id: grp_control, sorting_weight: 1}

  # Unit of the cabin temperature sensor above.
  cabin_temp_unit: fahrenheit

  # Room temperature the heater regulates on. This is the default after
  # flashing; the select below switches it at run time (survives a reboot).
  room_sensor: heater

  # Cabin sensor: sent to the heater when Room Sensor = "External".
  current_temperature_sensor: cabin_avg_temp

  # ── Heater status sensors ──────────────────────────────────────────────
  heater_state:
    name: "Espar Heater State"
    web_server: {sorting_group_id: grp_state, sorting_weight: 1}
    id: espar_heater_state
    icon: mdi:fire
    on_value:
      then:
        - if:
            condition:
              lambda: 'return x == "HEATING";'
            then:
              - light.turn_on:
                  id: status_led
                  red: 100%
                  green: 30%
                  blue: 0%
                  brightness: 50%
                  effect: "None"
        - if:
            condition:
              lambda: 'return x == "FAN";'
            then:
              - light.turn_on:
                  id: status_led
                  red: 0%
                  green: 0%
                  blue: 100%
                  brightness: 30%
                  effect: "None"
        - if:
            condition:
              lambda: 'return x == "IDLE";'
            then:
              - light.turn_on:
                  id: status_led
                  red: 0%
                  green: 100%
                  blue: 0%
                  brightness: 15%
                  effect: "None"
        - if:
            condition:
              lambda: 'return x == "COOLDOWN";'
            then:
              - light.turn_on:
                  id: status_led
                  red: 100%
                  green: 10%
                  blue: 0%
                  brightness: 20%
                  effect: "None"

  # True while the heater reports HEATING (0x2C4 D1=0x09) — includes the
  # ignition ramp, so it turns on before combustion is established.
  # YAML key stays `flame_active` for compatibility; entity was renamed from
  # "Espar Flame Active" — see "Upgrading" in esphome/README.md.
  flame_active:
    name: "Espar Heating"
    web_server: {sorting_group_id: grp_state, sorting_weight: 3}
    id: espar_flame_active
    device_class: running   # HA shows "Running / Not running" (heat would show "Hot / Normal")

  # Raw 0x2C4 D2 bit5. Previously used as "flame"; it doesn't appear on every
  # heater. Kept as a diagnostic so more data builds up across units/altitudes.
  flag_0x20:
    name: "Espar Status Flag 0x20"
    web_server: {sorting_group_id: grp_diag, sorting_weight: 10}
    id: espar_flag_0x20

  heater_connected:
    name: "Espar Connected"
    web_server: {sorting_group_id: grp_state, sorting_weight: 4}
    id: espar_connected
    device_class: connectivity

  fault_text:
    name: "Espar Fault"
    web_server: {sorting_group_id: grp_state, sorting_weight: 5}
    id: espar_fault
    icon: mdi:alert-circle-outline
    on_value:
      then:
        - if:
            condition:
              lambda: 'return x != "OK";'
            then:
              - light.turn_on:
                  id: status_led
                  red: 100%
                  green: 0%
                  blue: 0%
                  effect: "Fast Pulse"
            else:
              - light.turn_on:
                  id: status_led
                  red: 0%
                  green: 5%
                  blue: 0%
                  brightness: 10%
                  effect: "None"

  # ── Heater diagnostics (read-only, UDS 0x7A0 → 0x73C) ────────────────
  # Nothing is written, reset or cleared; nothing is sent in CAN Standby.
  diagnostics:
    update_interval: 10s        # while active; once a minute while idle
    # State
    combustion_phase:
      id: d_phase
      name: "Espar Phase"
      icon: mdi:fire-circle
      web_server: {sorting_group_id: grp_state, sorting_weight: 2}
    flame_detected:
      id: d_flame
      name: "Espar Flame"
      web_server: {sorting_group_id: grp_combustion, sorting_weight: 1}
    phase_step:
      name: "Espar Phase Step"
      web_server: {sorting_group_id: grp_combustion, sorting_weight: 7}
    phase_time:
      name: "Espar Phase Time"
      web_server: {sorting_group_id: grp_combustion, sorting_weight: 8}
    # Regulation — what the heater itself is working with
    heater_setpoint:
      name: "Espar Heater Setpoint"
      web_server: {sorting_group_id: grp_regulation, sorting_weight: 1}
    heater_temperature:
      id: d_heater_temp
      name: "Espar Heater Temperature"
      web_server: {sorting_group_id: grp_regulation, sorting_weight: 2}
    intake_temperature:
      id: d_intake
      name: "Espar Intake Temperature"
      web_server: {sorting_group_id: grp_regulation, sorting_weight: 3}
    power_demand:
      id: d_demand
      name: "Espar Power Demand"
      icon: mdi:gauge
      web_server: {sorting_group_id: grp_regulation, sorting_weight: 4}
    burn_time:
      id: d_burn
      name: "Espar Burn Time"
      icon: mdi:timer-outline
      web_server: {sorting_group_id: grp_regulation, sorting_weight: 5}
    # Combustion
    combustion_state:
      name: "Espar Combustion State"
      web_server: {sorting_group_id: grp_combustion, sorting_weight: 2}
    flame_temperature:
      id: d_flametemp
      name: "Espar Flame Temperature"
      web_server: {sorting_group_id: grp_combustion, sorting_weight: 3}
    glow_plug:
      id: d_glow
      name: "Espar Glow Plug"
      web_server: {sorting_group_id: grp_combustion, sorting_weight: 4}
    glow_plug_power:
      id: d_glowpw
      name: "Espar Glow Plug Power"
      web_server: {sorting_group_id: grp_combustion, sorting_weight: 5}
    # Fuel
    fuel_rate:
      id: d_fuelrate
      name: "Espar Fuel Rate"
      icon: mdi:gas-station
      web_server: {sorting_group_id: grp_fuel, sorting_weight: 1}
    fuel_pump_frequency:
      name: "Espar Fuel Pump"
      icon: mdi:pump
      web_server: {sorting_group_id: grp_fuel, sorting_weight: 2}
    fuel_total:
      id: d_fueltotal
      name: "Espar Fuel Total"
      icon: mdi:gas-station-outline
      web_server: {sorting_group_id: grp_fuel, sorting_weight: 3}
    fuel_pump_strokes:
      id: d_strokes
      name: "Espar Fuel Pump Strokes"
      icon: mdi:counter
      web_server: {sorting_group_id: grp_fuel, sorting_weight: 4}
    # Electrics and blower
    supply_voltage:
      id: d_volt
      name: "Espar Supply Voltage"
      web_server: {sorting_group_id: grp_electrics, sorting_weight: 1}
    blower_level:
      id: d_blower
      name: "Espar Blower Level"
      icon: mdi:fan
      web_server: {sorting_group_id: grp_electrics, sorting_weight: 2}
    control_unit_temperature:
      id: d_cutemp
      name: "Espar Control Unit Temperature"
      web_server: {sorting_group_id: grp_electrics, sorting_weight: 3}
    air_pressure:
      name: "Espar Air Pressure"
      web_server: {sorting_group_id: grp_electrics, sorting_weight: 4}
    # Counters (the heater's own)
    operating_hours:
      id: d_ophours
      name: "Espar Operating Hours"
      web_server: {sorting_group_id: grp_counters, sorting_weight: 1}
    hours_power_0_25:
      name: "Espar Hours 0-25 %"
      web_server: {sorting_group_id: grp_counters, sorting_weight: 2}
    hours_power_25_50:
      name: "Espar Hours 25-50 %"
      web_server: {sorting_group_id: grp_counters, sorting_weight: 3}
    hours_power_50_75:
      name: "Espar Hours 50-75 %"
      web_server: {sorting_group_id: grp_counters, sorting_weight: 4}
    hours_power_75_100:
      name: "Espar Hours 75-100 %"
      web_server: {sorting_group_id: grp_counters, sorting_weight: 5}
    hours_control_pause:
      name: "Espar Hours Control Pause"
      web_server: {sorting_group_id: grp_counters, sorting_weight: 6}
    hours_altitude_mode:
      name: "Espar Hours Altitude Mode"
      web_server: {sorting_group_id: grp_counters, sorting_weight: 7}
    start_stop_count:
      id: d_starts
      name: "Espar Start/Stop Count"
      icon: mdi:counter
      web_server: {sorting_group_id: grp_counters, sorting_weight: 8}
    # Identification
    software_version:
      name: "Espar Software Version"
      web_server: {sorting_group_id: grp_ident, sorting_weight: 1}
    hardware_version:
      name: "Espar Hardware Version"
      web_server: {sorting_group_id: grp_ident, sorting_weight: 2}
    part_number:
      name: "Espar Part Number"
      web_server: {sorting_group_id: grp_ident, sorting_weight: 3}
    # Fault memory (read on connect, on a fault, after each run, or via the button)
    fault_memory:
      id: d_faultmem
      name: "Espar Fault Memory"
      icon: mdi:alert-box-outline
      web_server: {sorting_group_id: grp_diag, sorting_weight: 1}

# ── Onboard WS2812 RGB LED (GPIO4) ───────────────────────────────────────────
# Amber=heating  Blue=fan  Dim green=idle/connected  Red pulse=fault
light:
  - platform: esp32_rmt_led_strip
    name: "Espar Status LED"
    web_server: {sorting_group_id: grp_control, sorting_weight: 8}
    id: status_led
    rgb_order: GRB
    chipset: WS2812
    pin: GPIO4
    num_leds: 1
    effects:
      - pulse:
          name: "Fast Pulse"
          transition_length: 0.25s
          update_interval: 0.25s

# ── Diagnostic / housekeeping ─────────────────────────────────────────────────
binary_sensor:
  # On while a remote-start preset is running
  - platform: template
    id: remote_input
    name: "Espar Remote Command"
    icon: mdi:remote
    lambda: 'return id(active_preset) > 0;'
    web_server: {sorting_group_id: grp_control, sorting_weight: 6}

  - platform: status
    name: "Espar Node Status"
    device_class: connectivity
    web_server: {sorting_group_id: grp_diag, sorting_weight: 21}

button:
  - platform: restart
    name: "Restart Espar Controller"
    icon: mdi:restart
    web_server: {sorting_group_id: grp_control, sorting_weight: 9}
  - platform: template
    name: "Espar Read Fault Memory"
    icon: mdi:alert-box-outline
    web_server: {sorting_group_id: grp_diag, sorting_weight: 2}
    on_press:
      - lambda: id(espar).read_fault_memory();

# ── CAN standby switch ────────────────────────────────────────────────────────
# Suspends all outbound CAN frames without physically unplugging the WeAct.
# Use before connecting a real EasyStart Pro / OEM diagnostic tool: the WeAct
# emulates the EasyStart Pro (same CAN IDs); both transmitting has been seen to
# trigger fault P000342 ("invalid configuration — check ADR coding").
# Resuming automatically re-runs the CAN handshake.
switch:
  # Lock: when off, remote commands are refused (reported as "locked")
  - platform: template
    name: "Espar Remote Start"
    id: remote_enable
    icon: mdi:car-key
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    web_server: {sorting_group_id: grp_control, sorting_weight: 7}

  - platform: template
    name: "Espar CAN Standby"
    id: espar_standby
    web_server: {sorting_group_id: grp_control, sorting_weight: 5}
    icon: mdi:pause-circle-outline
    restore_mode: ALWAYS_OFF
    optimistic: true
    turn_on_action:
      - lambda: id(espar).set_tx_standby(true);
    turn_off_action:
      - lambda: id(espar).set_tx_standby(false);

# ── Web dashboard with groups (optional — remove to save ~40 KB flash) ───────
web_server:
  port: 80
  version: 3
  sorting_groups:
    - {id: grp_control,    name: "Control",        sorting_weight: 10}
    - {id: grp_state,      name: "State",          sorting_weight: 20}
    - {id: grp_regulation, name: "Regulation",     sorting_weight: 30}
    - {id: grp_combustion, name: "Combustion",     sorting_weight: 40}
    - {id: grp_fuel,       name: "Fuel",           sorting_weight: 50}
    - {id: grp_electrics,  name: "Electrics and Blower", sorting_weight: 60}
    - {id: grp_counters,   name: "Counters",       sorting_weight: 70}
    - {id: grp_ident,      name: "Identification", sorting_weight: 80}
    - {id: grp_diag,       name: "Diagnostics",    sorting_weight: 90}
    - {id: grp_presets,    name: "Remote Presets", sorting_weight: 95}

# ── Room sensor, switchable from HA ─────────────────────────────────────────
select:
  # ── Remote-start presets 1–8 (a remote command selects one)
  - platform: template
    name: "Espar Preset 1 Mode"
    id: preset1_mode
    icon: mdi:numeric-1-box-outline
    optimistic: true
    restore_value: true
    options: ["Heat", "Fan"]
    initial_option: "Heat"
    entity_category: config
    web_server: {sorting_group_id: grp_presets, sorting_weight: 10}
  - platform: template
    name: "Espar Preset 2 Mode"
    id: preset2_mode
    icon: mdi:numeric-2-box-outline
    optimistic: true
    restore_value: true
    options: ["Heat", "Fan"]
    initial_option: "Heat"
    entity_category: config
    web_server: {sorting_group_id: grp_presets, sorting_weight: 20}
  - platform: template
    name: "Espar Preset 3 Mode"
    id: preset3_mode
    icon: mdi:numeric-3-box-outline
    optimistic: true
    restore_value: true
    options: ["Heat", "Fan"]
    initial_option: "Heat"
    entity_category: config
    web_server: {sorting_group_id: grp_presets, sorting_weight: 30}
  - platform: template
    name: "Espar Preset 4 Mode"
    id: preset4_mode
    icon: mdi:numeric-4-box-outline
    optimistic: true
    restore_value: true
    options: ["Heat", "Fan"]
    initial_option: "Heat"
    entity_category: config
    web_server: {sorting_group_id: grp_presets, sorting_weight: 40}
  - platform: template
    name: "Espar Preset 5 Mode"
    id: preset5_mode
    icon: mdi:numeric-5-box-outline
    optimistic: true
    restore_value: true
    options: ["Heat", "Fan"]
    initial_option: "Heat"
    entity_category: config
    web_server: {sorting_group_id: grp_presets, sorting_weight: 50}
  - platform: template
    name: "Espar Preset 6 Mode"
    id: preset6_mode
    icon: mdi:numeric-6-box-outline
    optimistic: true
    restore_value: true
    options: ["Heat", "Fan"]
    initial_option: "Fan"
    entity_category: config
    web_server: {sorting_group_id: grp_presets, sorting_weight: 60}
  - platform: template
    name: "Espar Preset 7 Mode"
    id: preset7_mode
    icon: mdi:numeric-7-box-outline
    optimistic: true
    restore_value: true
    options: ["Heat", "Fan"]
    initial_option: "Heat"
    entity_category: config
    web_server: {sorting_group_id: grp_presets, sorting_weight: 70}
  - platform: template
    name: "Espar Preset 8 Mode"
    id: preset8_mode
    icon: mdi:numeric-8-box-outline
    optimistic: true
    restore_value: true
    options: ["Heat", "Fan"]
    initial_option: "Heat"
    entity_category: config
    web_server: {sorting_group_id: grp_presets, sorting_weight: 80}
  - platform: template
    name: "Espar Room Sensor"
    id: sel_room_sensor
    icon: mdi:thermometer
    optimistic: true
    restore_value: true
    options:
      - "Heater"        # the heater's own intake sensor
      - "External"      # cabin_avg_temp
    initial_option: "Heater"
    web_server: {sorting_group_id: grp_control, sorting_weight: 3}
    on_value:
      - lambda: id(espar).set_room_sensor_controller(x == "External");

# ── Max run time (safety) ───────────────────────────────────────────────────
# The heater has no run-time limit of its own. HEAT or FAN ONLY is switched
# off after this time, however it was started.
number:
  - platform: template
    name: "Espar Max Run Time"
    id: max_run_time
    icon: mdi:timer-lock-outline
    optimistic: true
    restore_value: true
    min_value: 10
    max_value: 720
    step: 10
    initial_value: 120
    unit_of_measurement: min
    mode: box
    web_server: {sorting_group_id: grp_control, sorting_weight: 4}

  # ── Remote-start presets 1–8 (setpoint and duration)
  - platform: template
    name: "Espar Preset 1 Setpoint"
    id: preset1_setp
    icon: mdi:thermometer
    optimistic: true
    restore_value: true
    min_value: 5
    max_value: 35
    step: 1
    initial_value: 20
    unit_of_measurement: "°C"
    mode: box
    entity_category: config
    web_server: {sorting_group_id: grp_presets, sorting_weight: 11}
  - platform: template
    name: "Espar Preset 1 Duration"
    id: preset1_dur
    icon: mdi:timer-outline
    optimistic: true
    restore_value: true
    min_value: 10
    max_value: 720
    step: 10
    initial_value: 30
    unit_of_measurement: min
    mode: box
    entity_category: config
    web_server: {sorting_group_id: grp_presets, sorting_weight: 12}
  - platform: template
    name: "Espar Preset 2 Setpoint"
    id: preset2_setp
    icon: mdi:thermometer
    optimistic: true
    restore_value: true
    min_value: 5
    max_value: 35
    step: 1
    initial_value: 20
    unit_of_measurement: "°C"
    mode: box
    entity_category: config
    web_server: {sorting_group_id: grp_presets, sorting_weight: 21}
  - platform: template
    name: "Espar Preset 2 Duration"
    id: preset2_dur
    icon: mdi:timer-outline
    optimistic: true
    restore_value: true
    min_value: 10
    max_value: 720
    step: 10
    initial_value: 60
    unit_of_measurement: min
    mode: box
    entity_category: config
    web_server: {sorting_group_id: grp_presets, sorting_weight: 22}
  - platform: template
    name: "Espar Preset 3 Setpoint"
    id: preset3_setp
    icon: mdi:thermometer
    optimistic: true
    restore_value: true
    min_value: 5
    max_value: 35
    step: 1
    initial_value: 22
    unit_of_measurement: "°C"
    mode: box
    entity_category: config
    web_server: {sorting_group_id: grp_presets, sorting_weight: 31}
